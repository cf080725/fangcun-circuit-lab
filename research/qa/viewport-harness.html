<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>布局验收 · 硬件实验室</title><style>body{margin:0;background:#e0e5df;font:14px sans-serif;color:#254a35}header{padding:14px;display:flex;gap:10px;align-items:center}button{padding:9px;border:1px solid #a6b9a6;background:#fff;border-radius:5px;cursor:pointer}iframe{display:block;border:1px solid #9eb39f;margin:0 20px;background:#fff;width:390px;height:844px}</style><header><b>实际页面 · 视口验收</b><button data-size="390,844">手机 390 × 844</button><button data-size="820,900">平板 820 × 900</button><button data-size="1180,580">短屏 1180 × 580</button><span id="size">390 × 844</span></header><iframe id="preview" src="../../dist/index.html#lab" title="实验室响应式验收"></iframe><script>for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const [w,h]=b.dataset.size.split(',');document.querySelector('iframe').style.width=w+'px';document.querySelector('iframe').style.height=h+'px';document.querySelector('#size').textContent=w+' × '+h;};</script></html>
